[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wingman-telegram"
version = "0.1.0"
description = "Wingman Edge Telegram bot"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-telegram-bot>=22.7",
]

[tool.setuptools]
packages = ["bots"]
py-modules = ["main"]
