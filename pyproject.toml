[project]
name = "wingman-edge"
version = "0.1.0"
description = "Wingman Edge monorepo workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "wingman-backend",
    "wingman-telegram",
]

[tool.uv.sources]
wingman-backend = { workspace = true }
wingman-telegram = { workspace = true }

[tool.uv.workspace]
members = ["backend", "telegram"]
